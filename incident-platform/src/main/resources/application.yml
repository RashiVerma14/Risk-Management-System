spring:
  application:
    name: riskmanager

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/riskmanager}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: riskmanager-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.riskmanager.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

ai:
  provider: ${LLM_PROVIDER:groq}
  api-key: ${LLM_API_KEY:demo-key}
  model: ${LLM_MODEL:llama-3.3-70b-versatile}
  base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
  timeout-seconds: 15

rag:
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    collection-name: riskmanager_knowledge
    vector-size: 1536

notification:
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  email:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:alerts@riskmanager.io}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.riskmanager: INFO
    org.springframework.security: WARN